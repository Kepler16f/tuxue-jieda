name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.3.2)'
        required: true
        default: '0.3.2'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install npm dependencies
        run: npm install

      - name: Install iOS platform package
        run: npm install @capacitor/ios@8.5.3

      - name: Add iOS platform (provides macOS Catalyst target)
        run: npx cap add ios

      - name: Copy web assets
        run: npx cap copy ios

      - name: Extract version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(grep -oP "VERSION\s*=\s*'\K[^']+" site/app.js | head -1)
          fi
          [ -z "$V" ] && V="1.0.0"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Configure Mac Catalyst scheme
        working-directory: ios/App
        run: |
          set -e
          PBXPROJ="App.xcodeproj/project.pbxproj"
          # 为 iOS target 启用 Mac Catalyst 支持（SUPPORTS_MACCATALYST 注入到每个 build configuration）
          python3 - "$PBXPROJ" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          # 在 buildSettings 块里给每个 configuration 注入 SUPPORTS_MACCATALYST
          def inject(m):
              block = m.group(0)
              if 'SUPPORTS_MACCATALYST' in block:
                  return block
              return block + "\n\t\t\t\tSUPPORTS_MACCATALYST = YES;"
          s2 = re.sub(r'buildSettings = \{.*?\n\t\t\t\};', inject, s, flags=re.S)
          # 只给主 App target（第一个 buildSettings 块）注入
          open(p, 'w', encoding='utf-8').write(s2)
          PYEOF
          grep -c "SUPPORTS_MACCATALYST" "$PBXPROJ" || true

      - name: Build for macOS (Mac Catalyst)
        working-directory: ios/App
        run: |
          set -e
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SUPPORTS_MACCATALYST=YES \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*catalyst|BUILD SUCCEEDED|BUILD FAILED|ARCHIVE SUCCEEDED" || true
          grep -E "error:|BUILD FAILED" "$RUNNER_TEMP/build.log" && exit 1 || true
          ls "$RUNNER_TEMP/App.xcarchive/Products/Applications/" || ls "$RUNNER_TEMP/dd/Build/Products/Release/" || true

      - name: Export .app
        run: |
          set -e
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 产物"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/图学基础教程习题解答.app"
          PLIST="$RUNNER_TEMP/图学基础教程习题解答.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 图学基础教程习题解答" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 图学基础教程习题解答" "$PLIST" 2>/dev/null || true

      - name: Create DMG
        run: |
          set -e
          APP="$RUNNER_TEMP/图学基础教程习题解答.app"
          DMG_NAME="图学基础教程习题解答-${{ steps.ver.outputs.version }}-macOS.dmg"
          mkdir -p "$RUNNER_TEMP/dmg-root"
          rm -rf "$RUNNER_TEMP/dmg-root"/*
          cp -R "$APP" "$RUNNER_TEMP/dmg-root/"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          mkdir -p "$GITHUB_WORKSPACE/out"
          hdiutil create -volname "图学基础教程习题解答" \
            -srcfolder "$RUNNER_TEMP/dmg-root" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            "$GITHUB_WORKSPACE/out/$DMG_NAME"
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: out/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.dmg
          generate_release_notes: true
