[package]
name = "tuxue-jieda"
version = "0.3.1"
description = "图学基础教程习题解答"
authors = ["Kepler16f"]
edition = "2021"

[lib]
name = "tuxue_jieda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
